name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag; optional for a build-only rehearsal
        required: false
        type: string
      publish:
        description: Publish PyPI packages and the GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      source-sha: ${{ steps.release.outputs.source_sha }}
      hovel-version: ${{ steps.release.outputs.hovel_version }}
      picblobs-version: ${{ steps.release.outputs.picblobs_version }}
      picblobs-changed: ${{ steps.release.outputs.picblobs_changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-hovel
        with:
          cache-family: release-${{ github.job }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Validate release versions and source
        id: release
        run: aspect run //repo-tools/release:release_tool -- validate --tag="${RELEASE_TAG}" --publish="${RELEASE_PUBLISH}" --require-main
      - run: aspect hovel-check
      - uses: ./.github/actions/finish-hovel
        if: always()
        with:
          job-status: ${{ job.status }}

  reproducibility:
    needs: verify
    uses: ./.github/workflows/reproducibility.yml
    with:
      ref: ${{ needs.verify.outputs.source-sha }}
    secrets: inherit

  build-hovel:
    needs: [verify, reproducibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: "${{ needs.verify.outputs.source-sha }}", persist-credentials: false}
      - uses: ./.github/actions/setup-hovel
        with:
          cache-family: release-${{ github.job }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - run: aspect hovel-release hovel
      - run: aspect run //repo-tools/release:release_tool -- smoke --package=hovel --dist=core/dist
      - uses: ./.github/actions/verify-reproducible-artifacts
        with: {families: hovel}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: hovel-dist, path: "core/dist/*", if-no-files-found: error, retention-days: 14}
      - uses: ./.github/actions/finish-hovel
        if: always()
        with:
          job-status: ${{ job.status }}

  build-sdk:
    needs: [verify, reproducibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: "${{ needs.verify.outputs.source-sha }}", persist-credentials: false}
      - uses: ./.github/actions/setup-hovel
        with:
          cache-family: release-${{ github.job }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - run: aspect hovel-release sdk
      - run: aspect run //repo-tools/release:release_tool -- smoke --package=hovel-sdk --dist=dist
      - uses: ./.github/actions/verify-reproducible-artifacts
        with: {families: sdk}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: hovel-sdk-dist, path: "dist/*", if-no-files-found: error, retention-days: 14}
      - uses: ./.github/actions/finish-hovel
        if: always()
        with:
          job-status: ${{ job.status }}

  build-picblobs:
    needs: [verify, reproducibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: "${{ needs.verify.outputs.source-sha }}", persist-credentials: false}
      - uses: ./.github/actions/setup-hovel
        with:
          cache-family: release-${{ github.job }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - run: aspect hovel-release picblobs-cli -- --expected-version=${{ needs.verify.outputs.picblobs-version }}
      - run: aspect run //repo-tools/release:release_tool -- smoke --package=picblobs --dist=modules/picblobs/dist/picblobs
      - run: aspect run //repo-tools/release:release_tool -- smoke --package=picblobs-cli --dist=modules/picblobs/dist/picblobs-cli --dependency-dist=modules/picblobs/dist/picblobs
      - uses: ./.github/actions/verify-reproducible-artifacts
        with: {families: "picblobs,picblobs-cli"}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: picblobs-dist, path: "modules/picblobs/dist/", if-no-files-found: error, retention-days: 14}
      - uses: ./.github/actions/finish-hovel
        if: always()
        with:
          job-status: ${{ job.status }}

  build-modules:
    needs: [verify, reproducibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: "${{ needs.verify.outputs.source-sha }}", persist-credentials: false}
      - uses: ./.github/actions/setup-hovel
        with:
          cache-family: release-${{ github.job }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - run: aspect hovel-release modules
      - uses: ./.github/actions/verify-reproducible-artifacts
        with: {families: modules}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: module-packages, path: "dist/modules/", if-no-files-found: error, retention-days: 14}
      - uses: ./.github/actions/finish-hovel
        if: always()
        with:
          job-status: ${{ job.status }}

  build-agent:
    needs: [verify, reproducibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: "${{ needs.verify.outputs.source-sha }}", persist-credentials: false}
      - uses: ./.github/actions/setup-hovel
        with:
          cache-family: release-${{ github.job }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - run: aspect hovel-release agent
      - uses: ./.github/actions/verify-reproducible-artifacts
        with: {families: agent}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: agent-packages, path: "dist/agent/", if-no-files-found: error, retention-days: 14}
      - uses: ./.github/actions/finish-hovel
        if: always()
        with:
          job-status: ${{ job.status }}

  publish-hovel:
    if: github.event_name == 'push' || inputs.publish
    needs: [verify, build-hovel]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: "${{ needs.verify.outputs.source-sha }}", persist-credentials: false}
      - uses: ./.github/actions/setup-hovel
        with:
          cache-family: release-${{ github.job }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: hovel-dist, path: dist}
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with: {packages-dir: dist, skip-existing: true, attestations: true}
      - run: aspect run //repo-tools/release:release_tool -- verify-pypi --package=hovel --version=${{ needs.verify.outputs.hovel-version }} --dist=dist
      - uses: ./.github/actions/finish-hovel
        if: always()
        with:
          job-status: ${{ job.status }}

  publish-sdk:
    if: github.event_name == 'push' || inputs.publish
    needs: [verify, build-sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: "${{ needs.verify.outputs.source-sha }}", persist-credentials: false}
      - uses: ./.github/actions/setup-hovel
        with:
          cache-family: release-${{ github.job }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: hovel-sdk-dist, path: dist}
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with: {packages-dir: dist, skip-existing: true, attestations: true}
      - run: aspect run //repo-tools/release:release_tool -- verify-pypi --package=hovel-sdk --version=${{ needs.verify.outputs.hovel-version }} --dist=dist
      - uses: ./.github/actions/finish-hovel
        if: always()
        with:
          job-status: ${{ job.status }}

  publish-picblobs:
    if: github.event_name == 'push' || inputs.publish
    needs: [verify, build-picblobs]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi-picblobs
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: "${{ needs.verify.outputs.source-sha }}", persist-credentials: false}
      - uses: ./.github/actions/setup-hovel
        with:
          cache-family: release-${{ github.job }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: picblobs-dist, path: dist}
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        if: needs.verify.outputs.picblobs-changed == 'true'
        with: {packages-dir: dist/picblobs, skip-existing: true, attestations: true}
      - if: needs.verify.outputs.picblobs-changed == 'true'
        run: aspect run //repo-tools/release:release_tool -- verify-pypi --package=picblobs --version=${{ needs.verify.outputs.picblobs-version }} --dist=dist/picblobs
      - uses: ./.github/actions/finish-hovel
        if: always()
        with:
          job-status: ${{ job.status }}

  publish-picblobs-cli:
    if: github.event_name == 'push' || inputs.publish
    needs: [verify, build-picblobs, publish-picblobs]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi-picblobs-cli
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: "${{ needs.verify.outputs.source-sha }}", persist-credentials: false}
      - uses: ./.github/actions/setup-hovel
        with:
          cache-family: release-${{ github.job }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: picblobs-dist, path: dist}
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        if: needs.verify.outputs.picblobs-changed == 'true'
        with: {packages-dir: dist/picblobs-cli, skip-existing: true, attestations: true}
      - if: needs.verify.outputs.picblobs-changed == 'true'
        run: aspect run //repo-tools/release:release_tool -- verify-pypi --package=picblobs-cli --version=${{ needs.verify.outputs.picblobs-version }} --dist=dist/picblobs-cli
      - uses: ./.github/actions/finish-hovel
        if: always()
        with:
          job-status: ${{ job.status }}

  github-release:
    if: github.event_name == 'push' || inputs.publish
    needs: [verify, publish-hovel, publish-sdk, publish-picblobs-cli, build-modules, build-agent]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: "${{ needs.verify.outputs.source-sha }}", persist-credentials: false}
      - uses: ./.github/actions/setup-hovel
        with:
          cache-family: release-${{ github.job }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: "*-dist", path: dist/source/python, merge-multiple: true}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: module-packages, path: dist/source/modules}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: agent-packages, path: dist/source/agent}
      - run: aspect run //repo-tools/release:release_tool -- stage-assets --source=dist/source/python --source=dist/source/modules --source=dist/source/agent --output=dist/release-assets
      - run: aspect run //repo-tools/release:release_tool -- manifest --tag="${RELEASE_TAG}" --root=dist/release-assets --output=dist/release-assets/release-manifest.json --checksums=dist/release-assets/SHA256SUMS
      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/release-assets/*
      - uses: ./.github/actions/finish-hovel
        if: always()
        with:
          job-status: ${{ job.status }}
