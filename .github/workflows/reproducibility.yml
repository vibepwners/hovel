name: Reproducibility

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.workflow }}-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  first:
    uses: ./.github/workflows/repro-build.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      replica: a
    secrets: inherit
  second:
    # Finish the first build before allocating a separate runner, avoiding
    # concurrent identical executions being coalesced by the remote service.
    needs: first
    uses: ./.github/workflows/repro-build.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      replica: b
    secrets: inherit
  compare:
    needs: [first, second]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-hovel
        with:
          cache-family: reproducibility-compare
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: repro-*
          path: dist/reproducibility/input
      - name: Compare every artifact path, size, and SHA-256
        run: aspect hovel-repro compare -- --first=dist/reproducibility/input/repro-a/manifest.json --second=dist/reproducibility/input/repro-b/manifest.json --output=dist/reproducibility/comparison.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reproducibility-comparison
          path: dist/reproducibility/comparison.json
          if-no-files-found: warn
          retention-days: 30
      - uses: ./.github/actions/finish-hovel
        if: always()
        with:
          job-status: ${{ job.status }}
